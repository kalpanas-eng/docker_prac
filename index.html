<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>

    <!-- Internal CSS -->
    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
        }

        .card {
            width: 350px;
            margin: 100px auto;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 0px 10px gray;
        }

        h1 {
            color: #ff6699;
        }

        h3 {
            color: #555;
        }

        p {
            color: #666;
        }

        .skills {
            background-color: #ffe6ee;
            padding: 10px;
            margin: 15px;
            border-radius: 10px;
        }

        button {
            background-color: #ff6699;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #ff3366;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Kalpana Singh</h1>

        <h3>Web Development Student</h3>

        <p>
            Hello! I am a college student interested in
            Web Development and Programming.
        </p>

        <div class="skills">
            <b>My Skills</b>
            <p>HTML | CSS | Python | Machine Learning</p>
        </div>

        <button>Contact Me</button>

    </div>

</body>
</html>
